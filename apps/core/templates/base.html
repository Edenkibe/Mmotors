  #custom js and ajax
  <script>
    //here ici change la disponibilite de la voiture en visible ou invisible
    $(document).on('click', '.dispo_car', function(event){ 
    event.preventDefault();

    const button = event.currentTarget;           // le bouton cliqué
    const url = this.href;                      // URL du contenu
    
    const show_dispo = button.querySelector('span.disponibilite'); // class pour show le resultat
    
    axios.get(url)
        .then(response => {
            // Mise à jour the type
            show_dispo.textContent =response.data.button_text;
        })
        .catch(error => {
            if(error.response && error.response.status === 403){
                window.alert("Connecte-toi avant de changer la disponibilite !");
            } else {
                console.error("Une erreur est survenue :", error);
            }
        });
    });
    
    
    //la recherche de voiture sur la barre 
    $(function () {
    $('.lookover').on('keyup', function () {
      
        let query = $(this).val().trim();
        let url = $(this).data('url');

        //si la barre est vide on retourne tout 
        if (query.length === 0 || query.length >= 2) {

            $.ajax({
                url: url,
                type: 'GET',
                data: {
                    q: query
                },
                success: function (data) {
                    $('.showCasse').html(data);
                    $('.errrorgoeshere').html('');
                }
            });

        } 
        else {

            $('.errorhere').html(
                '<small class="text-danger">Please enter at least 2 characters to see result</small>'
            );
        }

    });
    });
