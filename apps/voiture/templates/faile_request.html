
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            text-align: center;
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-container">
            <div class="error-code text-danger">Bad request</div>


            <p class="fw-bold mb-3 text-danger">
               La date de retour doit être après la date de début. ex: 12 aout 2023 - 13 aout 2023
            </p>

            <a href="{%  url 'core:home' %}" class="btn btn-primary px-4">
                Back to Home
            </a>
        </div>
    </div>

</body>
</html>
